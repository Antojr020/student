<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>SmartMark - Student Marks Management System</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/"><i class="bi bi-mortarboard-fill"></i> SmartMark</a>
            <div class="d-flex align-items-center ms-auto">
                <button class="btn btn-outline-light me-3 rounded-circle" id="themeToggle" title="Toggle Dark Mode">
                    <i class="bi bi-moon-stars-fill"></i>
                </button>
                {% if current_user.is_authenticated %}
                <span class="text-white me-3 d-none d-md-inline">Role: <strong>{{ current_user.role | capitalize }}</strong></span>
                <a href="{{ url_for('logout') }}" class="btn btn-danger btn-sm fw-bold">Logout <i class="bi bi-box-arrow-right"></i></a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container mt-4 mb-5">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
