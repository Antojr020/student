<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | SmartMark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1.5rem;
        }
        .error-card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 1.25rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 580px;
            width: 100%;
            padding: 2.5rem;
            text-align: center;
        }
        .error-code {
            font-size: 5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="mb-3">
            <i class="bi bi-question-circle text-info fs-1"></i>
        </div>
        <div class="error-code">404</div>
        <h3 class="fw-bold mb-2 text-white">Resource Not Found</h3>
        <p class="text-white-50 mb-4">
            The page or resource you requested could not be found on the academic portal. Please verify the URL or return to the main dashboard.
        </p>

        <div class="d-flex justify-content-center gap-3">
            <a href="/" class="btn btn-primary px-4 py-2 fw-semibold rounded-3">
                <i class="bi bi-house-door me-1"></i> Return to Home
            </a>
            <a href="/login" class="btn btn-outline-light px-4 py-2 fw-semibold rounded-3">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In Page
            </a>
        </div>
    </div>
</body>
</html>
